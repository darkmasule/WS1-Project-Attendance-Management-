<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance</title>
    <link rel="stylesheet" href="" />
</head>

<body>
    <nav class="sidebar">
        <div class="top">
            <img src="../img_use/top_icons.png" alt="sidebar" />
        </div>

        <div class="mid">
            <img src="../img_use/attendance_icon.png" alt="attendance" />
            <img src="../img_use/overview_icon.png" alt="overview" />
            <img src="../img_use/history_icon.png" alt="history" />
        </div>

        <div class="bot">
            <img src="../img_use/settings_icon.png" alt="settings" />
            <img src="../img_use/exit_icon.png" alt="exit" />
        </div>
    </nav>

    <div class="headerandmain">
        <header>
            <div>
                <h2>Overview</h2>
            </div>

            <div class="ctadiv">
                <p>Go back, Lei?</p>
                <img src="../img_use/profile_icon.png" alt="icon" />
            </div>
        </header>

        <main>
            <div class="searchsubject">
                <div>
                    <div>
                        <h2>Subject:</h2>
                        <select name="subject" id="subject">
                            <option value="" hidden></option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="manualinput">
                <h2>Manual Input</h2>
                <div class="status">
                    <h3>Status:</h3>
                    <input type="checkbox" name="present" id="present">
                    <label for="present">Present</label>
                    <input type="checkbox" name="late" id="late">
                    <label for="late">Late</label>
                    <input type="checkbox" name="absent" id="absent">
                    <label for="absent">Absent</label>
                </div>

                <div class="studentinfo">
                    <h3>Student Information:</h3>
                    <button>Record</button>

                    <label for="idno">ID no.</label>
                    <input type="text" id="idno">

                    <label for="lname">Last Name:</label>
                    <input type="text" name="lname" id="lname">

                    <label for="fname">First Name:</label>
                    <input type="text" name="fname" id="fname">
                </div>

                <div>

                </div>
            </div>

            <div class="qrcode">

            </div>
        </main>
    </div>

</body>

</html>
